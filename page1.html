<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 1</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        table.inventory {
            border-collapse: collapse;
            width: 450px;
        }
        table.inventory th, table.inventory td {
            border: 1px solid #333;
            padding: 6px 10px;
            text-align: left;
        }
        table.inventory td[contenteditable="true"] {
            background: #f7f7f7;
        }
        th {
            background: #e6e6e6;
        }
    </style>
</head>

<body>
    <div class="welcome-container">
        <h1>Page 1</h1>

        <p>Select a screen:</p>
        <a href="screenA.html"><button>Go to Screen A</button></a>
        <a href="screenB.html"><button>Go to Screen B</button></a>
        <br><br>
        <a href="blank.html"><button>Return</button></a>

        <hr><br>

        <h2>Metal Inventory</h2>

        <!-- TABLE FORMAT MATCHING YOUR IMAGE -->
        <table id="metalTable" class="inventory">
            <tr>
                <th>Metal</th>
                <th>New Sheets</th>
                <th>Old Sheets</th>
            </tr>

            <tr>
                <td>aluminium</td>
                <td contenteditable="true">2</td>
                <td contenteditable="true">1</td>
            </tr>
            <tr>
                <td>brass</td>
                <td contenteditable="true">5</td>
                <td contenteditable="true">6</td>
            </tr>
            <tr>
                <td>bronze</td>
                <td contenteditable="true">2</td>
                <td contenteditable="true">4</td>
            </tr>
            <tr>
                <td>copper</td>
                <td contenteditable="true">2</td>
                <td contenteditable="true">3</td>
            </tr>
            <tr>
                <td>mild steel</td>
                <td contenteditable="true">3</td>
                <td contenteditable="true">8</td>
            </tr>
            <tr>
                <td>stainless steel</td>
                <td contenteditable="true">7</td>
                <td contenteditable="true">5</td>
            </tr>
            <tr>
                <td>titanium</td>
                <td contenteditable="true">1</td>
                <td contenteditable="true">4</td>
            </tr>
            <tr>
                <td>galvanised steel</td>
                <td contenteditable="true">1</td>
                <td contenteditable="true">2</td>
            </tr>
        </table>
    </div>

<script>
/* ================================
   GET VALUE (rowIndex 0-7, col 1-2)
   col 1 = New Sheets
   col 2 = Old Sheets
================================ */
function getValue(row, col) {
    const table = document.getElementById("metalTable");
    const bodyRows = table.rows;
    return bodyRows[row + 1].cells[col].textContent.trim();
}

/* ================================
   SET VALUE
================================ */
function setValue(row, col, value) {
    const table = document.getElementById("metalTable");
    const bodyRows = table.rows;
    bodyRows[row + 1].cells[col].textContent = value;
}

/* =============== EXAMPLES =============== */
console.log("Bronze (row 2) new sheets:", getValue(2, 1));
setValue(0, 1, "10");
console.log("Aluminium new sheets updated to:", getValue(0, 1));
</script>

</body>
</html>
