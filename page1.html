        <!-- NEW TABLE + BUTTONS -->
        <h2>Editable Table</h2>

        <div class="button-row">
            <button onclick="addRow()">Add Row</button>
            <button onclick="deleteRow()">Delete Last Row</button>
        </div>

      <table border="1" cellpadding="6" cellspacing="0">
<tr>
<th></th>
<th>A</th>
<th>B</th>
<th>C</th>
<th>D</th>
</tr>
<tr>
<th>A</th>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>
<tr>
<th>B</th>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>
<tr>
<th>C</th>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>
<tr>
<th>D</th>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>
</table>

    </div>

    <script>
        function addRow() {
            let table = document.getElementById("myTable");
            let row = table.insertRow(-1);

            let id = row.insertCell(0);
            let item = row.insertCell(1);

            id.innerHTML = table.rows.length - 1;
            item.innerHTML = "New Item";
        }

        function deleteRow() {
            let table = document.getElementById("myTable");

            if (table.rows.length > 1) {
                table.deleteRow(-1);
            }
        }
    </script>

</body>
