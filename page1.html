<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 1</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        table.matrix td {
            width: 40px;
            height: 30px;
            text-align: center;
        }
        table.matrix td[contenteditable="true"] {
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>Page 1</h1>

        <p>Select a screen:</p>

        <a href="screenA.html"><button>Go to Screen A</button></a>
        <a href="screenB.html"><button>Go to Screen B</button></a>

        <br><br>
        <a href="blank.html"><button>Return</button></a>

        <hr><br>

        <h2>Editable Matrix Table</h2>

        <!-- FIXED: Give the table an ID and make cells editable -->
        <table id="matrixTable" class="matrix" border="1" cellpadding="6" cellspacing="0">
            <tr>
                <th></th>
                <th>A</th>
                <th>B</th>
                <th>C</th>
                <th>D</th>
            </tr>
            <tr>
                <th>A</th>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
            </tr>
            <tr>
                <th>B</th>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
            </tr>
            <tr>
                <th>C</th>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
            </tr>
            <tr>
                <th>D</th>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
            </tr>
        </table>

    </div>

<script>
/* =======================
   GET VALUE FROM MATRIX
   row/col are 0-based (A=0, B=1, etc.)
======================= */
function getEdgeValue(row, col) {
    const table = document.getElementById("matrixTable");
    const bodyRows = table.rows;
    const cell = bodyRows[row + 1].cells[col + 1];
    return cell.textContent.trim();
}

/* =======================
   SET VALUE IN MATRIX
======================= */
function setEdgeValue(row, col, value) {
    const table = document.getElementById("matrixTable");
    const bodyRows = table.rows;
    const cell = bodyRows[row + 1].cells[col + 1];
    cell.textContent = value;
}

/* =======================
   EXAMPLE OUTPUT TO CONSOLE
======================= */
console.log("A → C =", getEdgeValue(0, 2)); // reads row A col C

setEdgeValue(1, 3, "5"); // sets B → D = 5
console.log("B → D updated to:", getEdgeValue(1, 3));

</script>

</body>
</html>
